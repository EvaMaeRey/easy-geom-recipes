on:
    push:
      branches: [plotnine]
    release:
        types: [published]
    workflow_dispatch: {}

name: doc-website

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

        # Back to our regularly scheduled Quarto output
      - name: "Set up Quarto"
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "pre-release"

      - name: Install dependencies
        run: uv sync

      # Install quarto extensions
      - name: "Install quarto extensions"
        run: |
          quarto add --no-prompt r-wasm/quarto-live

      # Render the Quarto website to "_site/" (this is also the name of the default path
      # that is uploaded)
      - name: "Render working directory"
        run: uv run quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/deploy-pages/tree/v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
